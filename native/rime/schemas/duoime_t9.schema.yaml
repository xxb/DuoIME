# Clean-room DuoIME T9 9-key Pinyin schema (Option A permissive).
# Uses derive-tagged T9 digit projection so BOTH exact alphabetic syllables
# (locked T9 rail prefixes such as "ma'62") and raw T9 digits ("6262") resolve
# cleanly in the same prism without combinatorial intra-syllable noise.

schema:
  schema_id: duoime_t9
  name: "DuoIME 9键拼音"
  version: "1.0"
  description: "DuoIME clean-room T9 Pinyin schema supporting locked a-z prefix syllables + 2-9 digits."

switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "英文"]
  - name: full_shape
    reset: 0
    states: ["半角", "全角"]
  - name: traditionalization
    reset: 0
    states: ["简体", "繁體"]

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz23456789'"
  delimiter: " '"
  auto_select: false
  algebra:
    - erase/^xx$/
    - derive/^([a-z]+)$/$1@/
    - xform/[abc](?=.*@$)/2/
    - xform/[def](?=.*@$)/3/
    - xform/[ghi](?=.*@$)/4/
    - xform/[jkl](?=.*@$)/5/
    - xform/[mno](?=.*@$)/6/
    - xform/[pqrs](?=.*@$)/7/
    - xform/[tuv](?=.*@$)/8/
    - xform/[wxyz](?=.*@$)/9/
    - xform/@$//

translator:
  dictionary: duoime_pinyin
  prism: duoime_t9
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true

simplifier:
  option_name: traditionalization
  opencc_config: duoime_s2t.json
  tips: none

punctuator:
  __include: default:/punctuator

key_binder:
  __include: default:/key_binder

menu:
  page_size: 8
