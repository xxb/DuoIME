# Clean-room DuoIME 26-key Full Pinyin schema (Option A permissive).

schema:
  schema_id: duoime_pinyin_26
  name: "DuoIME 26键拼音"
  version: "1.0"
  description: "DuoIME clean-room 26-key Pinyin schema backed by permissive MIT starter lexicon."

switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "英文"]
  - name: full_shape
    reset: 0
    states: ["半角", "全角"]
  - name: traditionalization
    reset: 0
    states: ["简体", "繁體"]

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([jqxy])u$/$1v/
    - derive/^([nl])v$/$1u/

translator:
  dictionary: duoime_pinyin
  prism: duoime_pinyin_26
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/

simplifier:
  option_name: traditionalization
  opencc_config: duoime_s2t.json
  tips: none

punctuator:
  __include: default:/punctuator

key_binder:
  __include: default:/key_binder

menu:
  page_size: 8
