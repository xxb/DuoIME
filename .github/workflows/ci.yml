name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene-and-build:
    name: Hygiene, Build & Artifact Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PII_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PII scanner self-tests
        run: bash scripts/test_pii_check.sh

      - name: Run PII, commit-email & license gates
        env:
          PII_EXTRA_PATTERNS: ${{ secrets.PII_EXTRA_PATTERNS }}
        run: |
          bash scripts/pii_check.sh
          bash scripts/license_check.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept Android SDK licenses
        run: |
          if [[ ! -f "$ANDROID_HOME/licenses/android-sdk-license" ]]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
            yes | "$SDKM" --licenses >/dev/null || true
          fi

      - name: Run fast static checks (ShellCheck, ktlint, detekt)
        run: bash scripts/check.sh --ci-fast

      - name: Run unit tests, Android Lint, and assemble Release APK & Embed AAR
        run: |
          ./gradlew \
            :core:test \
            :engine-lite:test \
            testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            :duoime-embed:assembleRelease \
            -PappVersionName=0.0.0-ci \
            -PappVersionCode=1

      - name: Verify APK size, zero INTERNET permission, and Embed AAR hygiene
        run: bash scripts/verify_artifacts.sh

      - name: Upload Lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          retention-days: 3
          if-no-files-found: ignore
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml

      - name: Upload Detekt reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          retention-days: 3
          if-no-files-found: ignore
          path: "**/build/reports/detekt/**"

      - name: Ensure clean worktree
        run: |
          git status --short
          test -z "$(git status --porcelain)"
